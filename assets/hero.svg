<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#16537e"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#533483"/>
      <stop offset="100%" style="stop-color:#7952b3"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b6e6e"/>
      <stop offset="100%" style="stop-color:#14a3a3"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fc3f7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="340" fill="url(#bg)"/>

  <!-- Git Repository Box -->
  <rect x="40" y="122" width="150" height="80" rx="12" fill="url(#box1)"/>
  <text x="115" y="157" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Git Repository</text>
  <text x="115" y="177" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="11">GitHub / GitLab</text>

  <!-- AgentKit Box (Center) -->
  <rect x="300" y="82" width="200" height="160" rx="15" fill="url(#box2)" stroke="#4fc3f7" stroke-width="2"/>
  <text x="400" y="114" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">AgentKit</text>
  <text x="400" y="136" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="12">agentkit install</text>
  <text x="400" y="153" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="monospace" font-size="11">--agent claude | qwen</text>

  <!-- Convert step inside AgentKit -->
  <rect x="320" y="164" width="160" height="46" rx="8" fill="rgba(79,195,247,0.12)" stroke="#4fc3f7" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="400" y="182" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">convert conventions</text>
  <text x="400" y="199" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="10">CLAUDE.md ⇄ QWEN.md</text>

  <text x="400" y="229" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="10">Cross-platform · Zero deps</text>

  <!-- Claude Code Box -->
  <rect x="590" y="30" width="170" height="72" rx="10" fill="url(#box3)"/>
  <text x="675" y="57" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Claude Code</text>
  <text x="675" y="75" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="10">~/.claude/&lt;type&gt;/</text>
  <text x="675" y="91" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-family="Arial, sans-serif" font-size="9">skills · commands · agents · plugins</text>

  <!-- Qwen Code Box -->
  <rect x="590" y="126" width="170" height="72" rx="10" fill="url(#box4)"/>
  <text x="675" y="153" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Qwen Code</text>
  <text x="675" y="171" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="monospace" font-size="10">~/.qwen/&lt;type&gt;/</text>
  <text x="675" y="187" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="9">skills · commands · agents · extensions</text>

  <!-- Claude Desktop Box -->
  <rect x="590" y="222" width="170" height="62" rx="10" fill="url(#box3)"/>
  <text x="675" y="249" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Claude Desktop</text>
  <text x="675" y="268" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="10">.zip packs</text>

  <!-- Arrow: Git -> AgentKit -->
  <line x1="195" y1="162" x2="295" y2="162" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="245" y="152" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="10">clone / fetch</text>

  <!-- Arrow: AgentKit -> Claude Code -->
  <line x1="505" y1="118" x2="585" y2="70" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="530" y="82" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="10">install</text>

  <!-- Arrow: AgentKit -> Qwen Code -->
  <line x1="505" y1="162" x2="585" y2="162" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="545" y="152" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="10">install</text>
  <text x="545" y="178" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="9">+ convert</text>

  <!-- Arrow: AgentKit -> Claude Desktop -->
  <line x1="505" y1="206" x2="585" y2="253" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="530" y="246" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="10">pack</text>

  <!-- Feature badges -->
  <rect x="50" y="300" width="100" height="28" rx="14" fill="rgba(233,69,96,0.3)" stroke="#e94560" stroke-width="1"/>
  <text x="100" y="319" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Git-First</text>

  <rect x="170" y="300" width="110" height="28" rx="14" fill="rgba(79,195,247,0.3)" stroke="#4fc3f7" stroke-width="1"/>
  <text x="225" y="319" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Repo Cache</text>

  <rect x="300" y="300" width="110" height="28" rx="14" fill="rgba(20,163,163,0.3)" stroke="#14a3a3" stroke-width="1"/>
  <text x="355" y="319" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Multi-Agent</text>

  <rect x="430" y="300" width="160" height="28" rx="14" fill="rgba(79,195,247,0.3)" stroke="#4fc3f7" stroke-width="1"/>
  <text x="510" y="319" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Two-Way Conversion</text>

  <rect x="610" y="300" width="130" height="28" rx="14" fill="rgba(121,82,179,0.3)" stroke="#7952b3" stroke-width="1"/>
  <text x="675" y="319" text-anchor="middle" fill="#a78bfa" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Scoped Install</text>
</svg>
