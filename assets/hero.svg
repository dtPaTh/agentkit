<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#16537e"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#533483"/>
      <stop offset="100%" style="stop-color:#7952b3"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fc3f7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#bg)"/>

  <!-- Git Repository Box -->
  <rect x="40" y="100" width="150" height="80" rx="12" fill="url(#box1)"/>
  <text x="115" y="135" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Git Repository</text>
  <text x="115" y="155" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="11">GitHub / GitLab</text>

  <!-- AgentKit Box (Center) -->
  <rect x="310" y="90" width="180" height="100" rx="15" fill="url(#box2)" stroke="#4fc3f7" stroke-width="2"/>
  <text x="400" y="128" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">AgentKit</text>
  <text x="400" y="150" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="12">agentkit install</text>
  <text x="400" y="172" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="10">Cross-platform · Zero deps</text>

  <!-- Claude Code Box -->
  <rect x="590" y="60" width="170" height="75" rx="10" fill="url(#box3)"/>
  <text x="675" y="88" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Claude Code</text>
  <text x="675" y="106" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="10">~/.claude/&lt;type&gt;/</text>
  <text x="675" y="122" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Arial, sans-serif" font-size="9">skills · agents · plugins</text>

  <!-- Claude Desktop Box -->
  <rect x="590" y="155" width="170" height="70" rx="10" fill="url(#box3)"/>
  <text x="675" y="183" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Claude Desktop</text>
  <text x="675" y="203" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="10">.zip packs</text>

  <!-- Arrow: Git -> AgentKit -->
  <line x1="195" y1="140" x2="305" y2="140" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="250" y="130" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="10">clone / fetch</text>

  <!-- Arrow: AgentKit -> Claude Code -->
  <line x1="495" y1="120" x2="585" y2="97" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="542" y="95" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="10">install</text>

  <!-- Arrow: AgentKit -> Claude Desktop -->
  <line x1="495" y1="165" x2="585" y2="188" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="542" y="188" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="10">pack</text>

  <!-- Feature badges -->
  <rect x="80" y="250" width="100" height="28" rx="14" fill="rgba(233,69,96,0.3)" stroke="#e94560" stroke-width="1"/>
  <text x="130" y="269" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Git-First</text>

  <rect x="230" y="250" width="110" height="28" rx="14" fill="rgba(79,195,247,0.3)" stroke="#4fc3f7" stroke-width="1"/>
  <text x="285" y="269" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Repo Cache</text>

  <rect x="390" y="250" width="110" height="28" rx="14" fill="rgba(79,195,247,0.3)" stroke="#4fc3f7" stroke-width="1"/>
  <text x="445" y="269" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Dual Deploy</text>

  <rect x="550" y="250" width="130" height="28" rx="14" fill="rgba(121,82,179,0.3)" stroke="#7952b3" stroke-width="1"/>
  <text x="615" y="269" text-anchor="middle" fill="#a78bfa" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Scoped Install</text>
</svg>
